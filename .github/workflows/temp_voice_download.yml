name: TEMP Voice Download
on:
  push:
    paths:
      - '.github/workflows/temp_voice_download.yml'
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated voice clips
        run: |
          mkdir -p voice
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/690bc3f2-95df-4475-ba2f-ec4dc6426768.mp3' -o voice/01.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0754b9e0-d612-49d3-8efe-f145cb7bf3a3.mp3' -o voice/02.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2ece6afe-2bdc-4822-8462-48d177032ae6.mp3' -o voice/03.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8fb9a596-8569-4bcd-80ef-d79f22673d9b.mp3' -o voice/04.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/096c7dac-b85c-4081-9722-161af2451a47.mp3' -o voice/05.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ca13e8e8-90e8-434d-939e-7dfd418b0944.mp3' -o voice/06.mp3
          curl -L --fail 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c3b7212a-5432-4b59-86a7-01bb2c114427.mp3' -o voice/07.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: generated-voice-clips
          path: voice/*.mp3
          retention-days: 1
